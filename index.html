<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>基本情報RPG</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head>
<body><main class="app">
<header><div><p class="eyebrow">BASIC INFORMATION QUEST</p><h1>基本情報 <span>RPG</span></h1></div><button id="settingsBtn" class="iconbtn" aria-label="設定">⚙</button></header>
<section class="hero"><div class="hero-top"><span class="tag">PLAYER STATUS</span><span class="muted" id="nextXp"></span></div><h2 id="levelName">Lv.2 見習いエンジニア</h2><div class="xp-line"><span>XP <b id="xp">140</b></span><span class="muted">NEXT LEVEL</span></div><div class="bar"><i id="xpBar" style="width:40%"></i></div><div class="stats"><div><b id="streak">8</b><small>連続正解</small></div><div><b id="correct">8</b><small>正解</small></div><div><b id="wrong">0</b><small>不正解</small></div><div><b id="accuracy">100%</b><small>正答率</small></div></div></section>
<section class="quest"><div class="row"><span class="tag" id="chapterTag">第1章</span><span class="muted">MAIN QUEST</span></div><h2 id="questTitle">論理演算</h2><p id="questSub">第9問 · 論理演算 OR</p><button id="startBtn" class="primary">冒険を再開する →</button></section>
<section class="panel"><div class="row"><h3>習得スキル</h3><span class="muted"><b id="skillCount">5</b> SKILLS</span></div><div id="skills" class="skills"></div></section>
<section class="grid"><button id="reviewBtn" class="tile"><span>🧭</span><b>苦手問題</b><small>復習クエスト</small></button><button id="historyBtn" class="tile"><span>📜</span><b>冒険の記録</b><small>学習履歴</small></button></section>
<nav><button id="navQuest">⚔️<small>冒険</small></button><button id="navReview">🧭<small>復習</small></button><button id="navRecord">📜<small>記録</small></button></nav>
</main>
<dialog id="questionDialog"><div class="dialoghead"><span id="qStage" class="tag">STAGE</span><button data-close="questionDialog" class="iconbtn">✕</button></div><p id="qCategory" class="muted"></p><h2 id="qTitle"></h2><p id="qText" class="question"></p><div id="choices" class="choices"></div><p id="hint" class="muted"></p><div id="result" class="result hidden"></div><button id="submitAnswer" class="primary" disabled>回答する</button><button id="nextQuestion" class="primary hidden">次の問題へ →</button></dialog>
<dialog id="reviewDialog"><div class="dialoghead"><h2>苦手問題</h2><button data-close="reviewDialog" class="iconbtn">✕</button></div><div id="reviewContent"></div></dialog>
<dialog id="historyDialog"><div class="dialoghead"><h2>冒険の記録</h2><button data-close="historyDialog" class="iconbtn">✕</button></div><div id="historyContent"></div></dialog>
<dialog id="settingsDialog"><div class="dialoghead"><h2>設定・データ管理</h2><button data-close="settingsDialog" class="iconbtn">✕</button></div><p class="muted">学習データはこの端末のブラウザ内に保存されます。</p><button id="exportBtn" class="secondary">学習データをバックアップ</button><label class="secondary filelabel">バックアップを復元<input id="importFile" type="file" accept="application/json"></label><hr><label>AI解説APIの接続先<input id="apiEndpoint" placeholder="https://example.com/api/explain"></label><button id="saveSettings" class="secondary">設定を保存</button><p id="aiStatus" class="muted tiny">AI APIは任意設定です。未設定でも問題演習できます。</p><hr><button id="resetBtn" class="danger">学習データを初期化</button></dialog>
<script src="./app.js"></script></body></html>
